name: CI

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "README.ru.md"
      - "CHANGELOG.md"
      - "**/*.md"
      - "assets/**"
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "README.ru.md"
      - "CHANGELOG.md"
      - "**/*.md"
      - "assets/**"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-secret-placeholder-minimum-32-chars
      NEXTAUTH_URL: http://localhost:4030
      DISABLE_PWA: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify base/head commits are available
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          IS_TAG_REF: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ "$IS_TAG_REF" = "true" ]; then
            echo "Tag ref detected; skipping base/head availability check."
            exit 0
          fi
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "$BASE_SHA^{commit}" || {
              echo "BASE_SHA commit is not available locally: $BASE_SHA"
              exit 1
            }
            git cat-file -e "$HEAD_SHA^{commit}" || {
              echo "HEAD_SHA commit is not available locally: $HEAD_SHA"
              exit 1
            }
          fi

      - name: Verify Prisma migration exists when schema changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          IS_TAG_REF: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ "$IS_TAG_REF" = "true" ]; then
            echo "Tag ref detected; skipping strict migration diff check."
            exit 0
          fi
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            npm run db:check-migrations -- --base=$BASE_SHA --head=$HEAD_SHA
          else
            echo "BASE_SHA not available (first push), skipping strict diff check."
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
