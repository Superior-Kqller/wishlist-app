services:
  wishlist-app:
    image: ${WISHLIST_APP_IMAGE:-ghcr.io/superior-kqller/wishlist-app:latest}
    container_name: wishlist-app
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT:-4030}:4030"
    environment:
      DATABASE_PROVIDER: pglite
      PGLITE_DATA_DIR: /app/data/pglite
      PGLITE_PORT: 5432
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port = process.env.PORT || 4030; fetch('http://127.0.0.1:' + port + '/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - uploads-data:/app/public/uploads
      - pglite-data:/app/data
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true

volumes:
  uploads-data:
  pglite-data:
