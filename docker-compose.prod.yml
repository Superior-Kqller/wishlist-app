services:
  wishlist-db:
    image: postgres:18.4-alpine
    container_name: wishlist-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres18-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: wishlist
      POSTGRES_USER: wishlist
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - proxy

  wishlist-app:
    image: ${WISHLIST_APP_IMAGE:-ghcr.io/superior-kqller/wishlist-app:latest}
    container_name: wishlist-app
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT:-4030}:4030"
    depends_on:
      wishlist-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wishlist:${DB_PASSWORD}@wishlist-db:5432/wishlist
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port = process.env.PORT || 4030; fetch('http://127.0.0.1:' + port + '/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - uploads-data:/app/public/uploads
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true

volumes:
  postgres18-data:
  uploads-data:
