<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Вишлист — планирование подарков на своём сервере</title>
  <desc id="desc">Общие списки с настройкой доступа: подборку видят владелец и названные им люди, остальные — нет.</desc>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A887EE"/>
      <stop offset="1" stop-color="#7652C8"/>
    </linearGradient>
    <clipPath id="canvas">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="420" fill="#0E1119"/>
    <path d="M0 356C226 316 378 376 575 340S945 274 1200 326V420H0Z"
          fill="#151925"/>
    <path d="M754 0H1200V96C1043 127 913 116 754 72Z"
          fill="#8F68D8" opacity=".07"/>

    <g id="title-block" transform="translate(60 52)">
      <g aria-label="Логотип Вишлиста">
        <rect width="50" height="50" rx="15" fill="url(#brand)"/>
        <path d="M25 10l3.9 9.3 10 .8-7.6 6.5 2.3 9.7-8.6-5.1-8.6 5.1 2.3-9.7-7.6-6.5 10-.8L25 10z"
              fill="#F7F2FF"/>
      </g>

      <text x="70" y="31"
            fill="#A7B0BF"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" font-weight="700" letter-spacing="1.5">
        СВОЙ СЕРВЕР · ПЛАНИРОВАНИЕ ПОДАРКОВ
      </text>
      <text x="0" y="132"
            fill="#F4F6FA"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="78" font-weight="760" letter-spacing="-2.5">
        Вишлист
      </text>
      <text x="0" y="185"
            fill="#C7CED9"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="27" font-weight="520">
        Общие списки. Кому открыть.
      </text>
      <text x="0" y="224"
            fill="#C7CED9"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="27" font-weight="520">
        Цены, приоритеты, напоминания.
      </text>

      <g transform="translate(0 284)"
         font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
         font-size="17" font-weight="650">
        <rect width="160" height="42" rx="21" fill="#191D29" stroke="#343B4B"/>
        <text x="80" y="27" fill="#E0E4EB" text-anchor="middle">DOCKER COMPOSE</text>
        <rect x="174" width="72" height="42" rx="21" fill="#191D29" stroke="#343B4B"/>
        <text x="210" y="27" fill="#E0E4EB" text-anchor="middle">PWA</text>
        <rect x="260" width="208" height="42" rx="21" fill="#191D29" stroke="#343B4B"/>
        <text x="364" y="27" fill="#E0E4EB" text-anchor="middle">POSTGRES / PGLITE</text>
      </g>
    </g>

    <g id="privacy-proof" transform="translate(646 42)">
      <rect width="494" height="336" rx="24" fill="#121620" stroke="#343B4B"/>

      <g transform="translate(26 24)">
        <text x="0" y="20"
              fill="#A7B0BF"
              font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
              font-size="17" font-weight="700" letter-spacing="1">
          ОДНА ПОДБОРКА · КТО ВИДИТ
        </text>
        <text x="442" y="20"
              fill="#DDE2EA"
              font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="18" font-weight="650" text-anchor="end">
          День рождения
        </text>
        <line x1="0" y1="40" x2="442" y2="40" stroke="#343B4B"/>

        <g transform="translate(0 58)">
          <rect width="442" height="88" rx="16" fill="#191D29" stroke="#343B4B"/>
          <rect x="14" y="14" width="60" height="60" rx="12" fill="#211A34"/>
          <path d="M30 32h28v22H30zM36 32v-6h16v6"
                fill="none" stroke="#A887EE" stroke-width="3" stroke-linejoin="round"/>
          <text x="92" y="38"
                fill="#F2F4F7"
                font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
                font-size="22" font-weight="680">
            Билеты на концерт
          </text>
          <text x="92" y="65"
                fill="#A7B0BF"
                font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
                font-size="17" font-weight="650">
            ПРИОРИТЕТ · БЫЛО БЫ ЗДОРОВО
          </text>
          <path d="M410 34l8 8-8 8" fill="none" stroke="#697386" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <g transform="translate(0 164)">
          <rect width="213" height="82" rx="15" fill="#211A34" stroke="#7652C8"/>
          <text x="16" y="25"
                fill="#B9A4E7"
                font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
                font-size="16" font-weight="700">
            ПРИГЛАШЁННЫЕ
          </text>
          <circle cx="28" cy="55" r="11" fill="#A887EE"/>
          <path d="M23 55l4 4 7-9" fill="none" stroke="#0E1119" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
          <text x="48" y="62"
                fill="#F0EBFA"
                font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
                font-size="20" font-weight="680">
            Саша видит
          </text>
        </g>

        <g transform="translate(229 164)">
          <rect width="213" height="82" rx="15" fill="#172229" stroke="#2E5960"/>
          <text x="16" y="25"
                fill="#86CAD3"
                font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
                font-size="16" font-weight="700">
            ОСТАЛЬНЫЕ
          </text>
          <circle cx="28" cy="55" r="11" fill="#55B8C5"/>
          <path d="M23 55h10" stroke="#0E1119" stroke-width="2.5" stroke-linecap="round"/>
          <text x="48" y="62"
                fill="#D5F0F3"
                font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
                font-size="20" font-weight="680">
            Не видят ничего
          </text>
        </g>

        <g transform="translate(0 264)">
          <path d="M0 14h18" stroke="#55B8C5" stroke-width="2" stroke-linecap="round"/>
          <circle cx="24" cy="14" r="6" fill="#55B8C5"/>
          <text x="42" y="21"
                fill="#C9D1DC"
                font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
                font-size="18" font-weight="620">
            Напомнить 12 октября
          </text>
          <path d="M236 14h20" stroke="#475163" stroke-width="2" stroke-linecap="round"/>
          <path d="M249 8l8 6-8 6" fill="none" stroke="#697386" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M280 7l17 7-17 7 4-7z" fill="#A887EE"/>
          <text x="308" y="21"
                fill="#E0E4EB"
                font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
                font-size="18" font-weight="650">
            Telegram
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>
