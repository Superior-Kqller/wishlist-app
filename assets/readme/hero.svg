<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="390" viewBox="0 0 1200 390"
     role="img" aria-labelledby="title desc">
  <title id="title">Wishlist — self-hosted gift planning</title>
  <desc id="desc">Shared wishlists, private gift reservations, and calendar planning shown as a compact product flow.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151925"/>
      <stop offset="1" stop-color="#11141D"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A887EE"/>
      <stop offset="1" stop-color="#7652C8"/>
    </linearGradient>
    <clipPath id="hero-clip">
      <rect width="1200" height="390" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="390" fill="#0E1119"/>
    <circle cx="1108" cy="-16" r="244" fill="#8F68D8" opacity=".08"/>
    <circle cx="890" cy="406" r="228" fill="#55B8C5" opacity=".045"/>

    <g transform="translate(62 52)">
      <g aria-label="Wishlist brand mark">
        <rect width="48" height="48" rx="14" fill="url(#brand)"/>
        <path d="M24 9.5l3.8 9.1 9.8.8-7.5 6.4 2.3 9.5-8.4-5-8.4 5 2.3-9.5-7.5-6.4 9.8-.8L24 9.5z"
              fill="#F7F2FF"/>
      </g>

      <text x="68" y="14"
            fill="#9DA7B8"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" font-weight="600" letter-spacing="2.2">
        SELF-HOSTED GIFT PLANNING
      </text>
      <text x="0" y="118"
            fill="#F4F6FA"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="76" font-weight="760" letter-spacing="-3">
        Wishlist
      </text>
      <text x="0" y="169"
            fill="#C3CAD6"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="27" font-weight="500">
        Shared lists. Private reservations.
      </text>
      <text x="0" y="207"
            fill="#C3CAD6"
            font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="27" font-weight="500">
        No duplicate gifts.
      </text>

      <g transform="translate(0 260)"
         font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
         font-size="17" font-weight="600">
        <rect width="156" height="42" rx="21" fill="#191D29" stroke="#343B4B"/>
        <text x="78" y="27" fill="#DDE2EA" text-anchor="middle">DOCKER COMPOSE</text>
        <rect x="170" width="72" height="42" rx="21" fill="#191D29" stroke="#343B4B"/>
        <text x="206" y="27" fill="#DDE2EA" text-anchor="middle">PWA</text>
        <rect x="256" width="206" height="42" rx="21" fill="#191D29" stroke="#343B4B"/>
        <text x="359" y="27" fill="#DDE2EA" text-anchor="middle">POSTGRES / PGLITE</text>
      </g>
    </g>

    <g transform="translate(665 44)">
      <rect width="475" height="302" rx="24" fill="url(#panel)" stroke="#343B4B"/>

      <g transform="translate(26 24)">
        <text x="0" y="18"
              fill="#8F98A9"
              font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
              font-size="17" font-weight="700" letter-spacing="1.5">
          BIRTHDAY IDEAS
        </text>
        <text x="394" y="18"
              fill="#E7EAF0"
              font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="18" font-weight="650" text-anchor="end">
          4 wishes
        </text>
        <line x1="0" y1="37" x2="423" y2="37" stroke="#343B4B"/>

        <g transform="translate(0 58)">
          <rect width="190" height="136" rx="16" fill="#0E1119" stroke="#343B4B"/>
          <rect x="12" y="12" width="166" height="66" rx="10" fill="#1B2130"/>
          <path d="M78 48h24m-12-12v24" stroke="#A887EE" stroke-width="3" stroke-linecap="round"/>
          <text x="12" y="102"
                fill="#F1F3F7"
                font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
                font-size="20" font-weight="650">
            Espresso set
          </text>
          <text x="12" y="124"
                fill="#9DA7B8"
                font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
                font-size="16">
            HOME · HIGH
          </text>
        </g>

        <g transform="translate(204 58)">
          <rect width="219" height="136" rx="16" fill="#0E1119" stroke="#7652C8"/>
          <rect x="12" y="12" width="195" height="66" rx="10" fill="#211A34"/>
          <path d="M89 34h30v22H89zM96 34v-6h16v6" fill="none" stroke="#A887EE" stroke-width="3" stroke-linejoin="round"/>
          <text x="12" y="102"
                fill="#F1F3F7"
                font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
                font-size="20" font-weight="650">
            Concert tickets
          </text>
          <text x="12" y="124"
                fill="#BBA8E7"
                font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
                font-size="16" font-weight="700">
            RESERVED PRIVATELY
          </text>
        </g>

        <g transform="translate(0 214)">
          <rect width="274" height="40" rx="12" fill="#18222A" stroke="#2E5960"/>
          <circle cx="22" cy="20" r="7" fill="#55B8C5"/>
          <text x="40" y="26"
                fill="#CBEAF0"
                font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
                font-size="18" font-weight="650">
            Ready before 12 October
          </text>
        </g>

        <g transform="translate(290 214)">
          <rect width="133" height="40" rx="12" fill="#191D29" stroke="#343B4B"/>
          <path d="M17 13l15 6-15 6 3-6z" fill="#A887EE"/>
          <text x="42" y="26"
                fill="#DDE2EA"
                font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
                font-size="18" font-weight="650">
            Telegram
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>
