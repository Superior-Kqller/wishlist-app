services:
  wishlist-valkey:
    image: valkey/valkey:9.1.0-alpine
    container_name: wishlist-valkey
    restart: unless-stopped
    command: >
      valkey-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --port 0
      --unixsocket /run/valkey/valkey.sock
      --unixsocketperm 777
    healthcheck:
      test: ["CMD", "valkey-cli", "-s", "/run/valkey/valkey.sock", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - valkey-socket:/run/valkey
    networks:
      - proxy

  wishlist-app:
    depends_on:
      wishlist-valkey:
        condition: service_healthy
    environment:
      REDIS_URL: /run/valkey/valkey.sock
    volumes:
      - valkey-socket:/run/valkey:ro

volumes:
  valkey-socket:
