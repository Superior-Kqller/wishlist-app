# Один файл на все установки; режим выбирает COMPOSE_PROFILES в .env:
#   postgres         — приложение и PostgreSQL в отдельном контейнере
#   (пусто)          — приложение со встроенным PGlite (DATABASE_PROVIDER=pglite)
#   valkey           — добавка к любому режиму: общий счётчик лимитов
services:
  wishlist-db:
    image: postgres:18.4-alpine
    container_name: wishlist-db
    restart: unless-stopped
    profiles: [postgres]
    volumes:
      - postgres18-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: wishlist
      POSTGRES_USER: wishlist
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishlist"]
      interval: 5s
      timeout: 5s
      retries: 5

  wishlist-valkey:
    image: valkey/valkey:9.1.0-alpine
    container_name: wishlist-valkey
    restart: unless-stopped
    profiles: [valkey]
    command: >
      valkey-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --port 0
      --unixsocket /run/valkey/valkey.sock
      --unixsocketperm 777
    healthcheck:
      test: ["CMD", "valkey-cli", "-s", "/run/valkey/valkey.sock", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - valkey-socket:/run/valkey

  wishlist-app:
    image: ${WISHLIST_APP_IMAGE:-ghcr.io/superior-kqller/wishlist-app:latest}
    container_name: wishlist-app
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT:-4030}:4030"
    # Выключенный профилем сервис пропускается, а не роняет `up`
    depends_on:
      wishlist-db:
        condition: service_healthy
        required: false
      wishlist-valkey:
        condition: service_healthy
        required: false
    environment:
      # В режиме PGlite entrypoint подменяет адрес на встроенную базу
      DATABASE_URL: postgresql://wishlist:${DB_PASSWORD:-}@wishlist-db:5432/wishlist
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port = process.env.PORT || 4030; fetch('http://127.0.0.1:' + port + '/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    volumes:
      - uploads-data:/app/public/uploads
      - pglite-data:/app/data
      - valkey-socket:/run/valkey:ro
    # БД и Valkey — во внутренней сети стека; в proxy только приложение
    networks:
      - default
      - proxy

networks:
  proxy:
    name: proxy
    external: true

volumes:
  postgres18-data:
  uploads-data:
  pglite-data:
  valkey-socket:
